name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests
      - name: Package distributable folder
        shell: pwsh
        run: Compress-Archive -Path dist/KestrelStudio/* -DestinationPath KestrelStudio-Windows-x64.zip -CompressionLevel Optimal
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KestrelStudio-Windows-x64
          path: KestrelStudio-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KestrelStudio-Windows-x64
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.1' }}
          name: Kestrel Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.1' }}
          target_commitish: main
          body: |
            Windows x64 release of Kestrel Studio with improved Hugging Face GGUF search.

            Download `KestrelStudio-Windows-x64.zip`, extract it, then run `KestrelStudio.exe`.
          files: KestrelStudio-Windows-x64.zip
