name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run headless GUI smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:KESTREL_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "KestrelStudio-test-config"
          $env:KESTREL_DATA_DIR = Join-Path $env:RUNNER_TEMP "KestrelStudio-test-data"
          python main.py --smoke-test
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "app/constants.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "APP_VERSION was not found in app/constants.py." }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Application version: $version"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests
      - name: Verify frozen GUI startup and Qt plugins
        shell: pwsh
        run: |
          $dist = "dist/KestrelStudio"
          $windowsPlugin = Get-ChildItem -LiteralPath $dist -Recurse -Filter qwindows.dll -File | Select-Object -First 1
          $offscreenPlugin = Get-ChildItem -LiteralPath $dist -Recurse -Filter qoffscreen.dll -File | Select-Object -First 1
          if (-not $windowsPlugin) { throw "PySide6 qwindows.dll is missing from the bundle." }
          if (-not $offscreenPlugin) { throw "PySide6 qoffscreen.dll is missing from the bundle." }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:KESTREL_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "KestrelStudio-smoke-config"
          $env:KESTREL_DATA_DIR = Join-Path $env:RUNNER_TEMP "KestrelStudio-smoke-data"
          $process = Start-Process -FilePath "$dist/KestrelStudio.exe" -ArgumentList "--smoke-test" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke test exited with code $($process.ExitCode)." }
          $log = Join-Path $env:KESTREL_DATA_DIR "logs/kestrel.log"
          if (-not (Test-Path -LiteralPath $log)) { throw "Packaged GUI did not create its startup log." }
          $smokeLog = Get-Content -Raw -LiteralPath $log
          if ($smokeLog -notmatch "smoke test: all pages created") { throw "Packaged GUI did not finish its smoke test. Application log: $smokeLog" }
      - name: Build Windows setup executable
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild -Version ${{ steps.version.outputs.version }}
      - name: Verify setup executable
        shell: pwsh
        run: |
          $installer = "dist/installer/KestrelStudio-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Setup executable was not created: $installer" }
          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -lt 10MB) { throw "Setup executable looks incomplete ($size bytes)." }
          Write-Host ("Setup executable: {0} ({1:N1} MB)" -f $installer, ($size / 1MB))
      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: KestrelStudio-Setup-x64
          path: dist/installer/KestrelStudio-Setup-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
            $tag = "v${{ needs.build.outputs.version }}"
          }
          if (-not $tag) { throw "Could not determine the release tag." }
          $version = $tag -replace "^v", ""
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $tag"
      - uses: actions/download-artifact@v4
        with:
          name: KestrelStudio-Setup-x64
          path: release
      - name: Publish GitHub release setup executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Kestrel Studio ${{ steps.tag.outputs.tag }}
          target_commitish: main
          body: |
            Windows x64 setup for Kestrel Studio ${{ steps.tag.outputs.version }}. Run the installer and follow the setup wizard. It installs the complete application bundle, including the Qt platform plugins required to start the GUI.

            This release is a setup executable; do not extract or run the app executable by itself.
          files: release/KestrelStudio-Setup-x64.exe
